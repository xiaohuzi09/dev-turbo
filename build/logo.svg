<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 背景渐变：苹果蓝深→浅，左上到右下 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0058b0"/>
    </linearGradient>
    <!-- 火箭高光渐变 -->
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1fc"/>
    </linearGradient>
    <!-- 火焰渐变 -->
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffd60a"/>
      <stop offset="60%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0.9"/>
    </linearGradient>
    <!-- 柔和阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角方块背景（iOS squircle 风格） -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- 代码括号 </> 装饰：作为背景层，半透明 -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左尖括号 < -->
    <polyline points="200,360 120,512 200,664"/>
    <!-- 右尖括号 > -->
    <polyline points="824,360 904,512 824,664"/>
    <!-- 斜杠 / -->
    <line x1="560" y1="690" x2="464" y2="334"/>
  </g>

  <!-- 火箭主体（倾斜约 -20 度，朝右上） -->
  <g filter="url(#shadow)" transform="rotate(-20 512 512)">
    <!-- 火焰（在火箭下方） -->
    <g transform="translate(512, 700)">
      <path d="M -34 0
               C -50 50, -40 110, -18 150
               C -8 120, 8 120, 18 150
               C 40 110, 50 50, 34 0
               C 20 -10, -20 -10, -34 0 Z"
            fill="url(#flame)"/>
    </g>

    <!-- 火箭机身（胶囊形） -->
    <path d="M 512 230
             C 558 230, 596 268, 596 314
             L 596 560
             C 596 568, 590 574, 582 574
             L 442 574
             C 434 574, 428 568, 428 560
             L 428 314
             C 428 268, 466 230, 512 230 Z"
          fill="url(#body)"/>

    <!-- 舷窗（圆形窗口） -->
    <circle cx="512" cy="350" r="46" fill="#0a84ff"/>
    <circle cx="512" cy="350" r="46" fill="none" stroke="#ffffff" stroke-width="10"/>
    <!-- 舷窗高光 -->
    <ellipse cx="498" cy="335" rx="14" ry="10" fill="#ffffff" opacity="0.7"/>

    <!-- 机身分隔线 -->
    <line x1="442" y1="470" x2="582" y2="470" stroke="#cfe1f8" stroke-width="6"/>

    <!-- 左侧翼 -->
    <path d="M 428 470
             L 372 590
             L 372 624
             C 372 632, 378 638, 386 638
             L 428 638 Z"
          fill="#5ac8fa"/>
    <!-- 右侧翼 -->
    <path d="M 596 470
             L 652 590
             L 652 624
             C 652 632, 646 638, 638 638
             L 596 638 Z"
          fill="#5ac8fa"/>

    <!-- 鼻锥高光 -->
    <path d="M 512 230
             C 558 230, 596 268, 596 314
             L 596 360
             C 540 320, 484 320, 428 360
             L 428 314
             C 428 268, 466 230, 512 230 Z"
          fill="#ffffff" opacity="0.25"/>
  </g>
</svg>
